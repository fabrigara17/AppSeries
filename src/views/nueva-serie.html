<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AppSeries</title>
        <link rel="stylesheet" href="../style/style.css">
    </head>
    <body>
        <main class="main">
            <div class="card-form">
                <h1 class="title-form">Recomendá una serie</h1>
                <form id="form-serie" class="form">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" class="input" required>

                    <label for="genero">Género</label>
                    <select id="genero" class="input" required>
                        <option value="">Elegí un género</option>
                        <option value="Drama">Drama</option>
                        <option value="Comedia">Comedia</option>
                        <option value="Ciencia ficción">Ciencia ficción</option>
                        <option value="Terror">Terror</option>
                        <option value="Animación">Animación</option>
                        <option value="Documental">Documental</option>
                    </select>

                    <label for="puntuacion">Puntuación (0 a 10)</label>
                    <input type="number" id="puntuacion" class="input" min="0" max="10" step="0.1" required>

                    <label for="imagen">Portada</label>
                    <input type="file" id="imagen" class="input" accept="image/jpeg,image/png,image/webp">

                    <label for="resena">Reseña</label>
                    <textarea id="resena" class="input" rows="4"></textarea>

                    <label class="check">
                        <input type="checkbox" id="recomendada">
                        La recomiendo
                    </label>

                    <label for="user_email">Tu email</label>
                    <input type="email" id="user_email" class="input" required>

                    <button type="submit" class="button">Guardar serie</button>

                    <p id="mensaje" class="mensaje" role="status"></p>
                </form>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabaseClient.js"></script>
        <script src="../js/series.js"></script>
    </body>
</html>
