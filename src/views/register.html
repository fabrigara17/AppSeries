<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AppSeries</title>
        <link rel="stylesheet" href="../style/style.css">
    </head>
    <body>
        <main class="main">
            <div class="card-form">
                <h1 class="title-form">Registrate en AppSeries</h1>
                <form id="formulario" class="form">
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" class="input" required>

                    <label for="apellido">Apellido</label>
                    <input type="text" name="apellido" id="apellido" class="input" required>

                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" class="input" required>

                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" class="input" required>

                    <button type="submit" class="button">Registrarse</button>

                    <a class="link" href="../../index.html">¿Ya tenés una cuenta? Entrá acá</a>
                </form>
            </div>
        </main>
    </body>
</html>
